# Publish the editor to GitHub Pages.
#
# One-time setup: repository Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". After that every push here redeploys the site.
#
# The site is plain HTML/CSS/ES modules and already lives in `public/`, so
# there is nothing to build — the job just uploads that directory.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      # The site currently lives on a claude/* branch; remove this once it is
      # merged into your default branch.
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the site is intact
        run: |
          test -f public/index.html
          test -f public/assets/manifest.js
          test -f public/assets/sprites.js
          echo "Publishing $(find public -type f | wc -l) files."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
